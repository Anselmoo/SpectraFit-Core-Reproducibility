# What the paper is pinned to. reproduce.py refuses to run against anything else.

[software]
name = "spectrafit-core"
version = "0.1.2"
doi = "10.5281/zenodo.23043544"          # Zenodo record of the release
wheel = "spectrafit-core==0.1.2 from PyPI, hash-pinned in uv.lock"

[source]
repository = "https://github.com/Anselmoo/SpectraFit-Core.git"
tag = "v0.1.2"
commit = "1e304188a7376caf128fcb432a16554ed44ad32a"
source_date_epoch = 1791201843             # commit time of the tag; fixes figure timestamps

# Checked at start-up against the installed environment.
[packages]
spectrafit-core = "0.1.2"
lmfit = "1.3.4"
scipy = "1.18.0"
numpy = "2.5.1"


# What the paper is pinned to. reproduce.py refuses to run against anything else.

[software]
name = "spectrafit-core"
version = "0.1.2"
doi = "10.5281/zenodo.23043544"          # Zenodo record of the release
wheel = "spectrafit-core==0.1.2 from PyPI, hash-pinned in uv.lock"

[source]
repository = "https://github.com/Anselmoo/SpectraFit-Core.git"
tag = "v0.1.2"
commit = "1e304188a7376caf128fcb432a16554ed44ad32a"
source_date_epoch = 1791201843             # commit time of the tag; fixes figure timestamps

# Checked at start-up against the installed environment.
[packages]
spectrafit-core = "0.1.2"
lmfit = "1.3.4"
scipy = "1.18.0"
numpy = "2.5.1"

# The timing measurement of record: measured on terra with the PyPI wheel 0.1.2 and the
# v0.1.2 harness (an export of the commit above), by bench/run_timing.sh in this repository.
[timing]
host = "terra"
started_utc = "2026-10-06T07:24:05Z"
finished_utc = "2026-10-07T09:30:36Z"
library = "spectrafit-core 0.1.2, PyPI wheel, hash-pinned in uv.lock"
harness = "v0.1.2 (1e304188), git archive export; scripts/bench_ladder.py and oracles run unmodified"
ladder = "--reps 4,10,20,50,100 (effective 2,5,10,25,50), --mc 8, seed 20260603"
seed_sweep = "seeds 20260603..20260652, --reps 10 (effective 5), --mc 8, headline-only"

# SHA-256 of the measured files the claims and Figure 3 are computed from (results/timing/).
[timing_inputs]
"results/timing/bench_summary.json" = "31dc536855c2c74d86b10db684f986a287a92b76a50b4e1939a5c99332754c86"

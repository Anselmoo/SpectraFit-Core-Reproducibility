# What the paper is pinned to. reproduce.py refuses to run against anything else.

[software]
name = "spectrafit-core"
version = "0.1.3"
doi = "10.5281/zenodo.24282350"          # Zenodo version DOI of release 0.1.3
concept_doi = "10.5281/zenodo.23043544"  # Zenodo concept DOI (resolves to the latest release)
wheel = "spectrafit-core==0.1.3 from PyPI, hash-pinned in uv.lock"

[source]
repository = "https://github.com/Anselmoo/SpectraFit-Core.git"
tag = "v0.1.3"
commit = "952c5c954eed2e0e36224ddf2f9859086d36fad7"
source_date_epoch = 1794828519             # commit time of the tag; fixes figure timestamps

# Checked at start-up against the installed environment.
[packages]
spectrafit-core = "0.1.3"
lmfit = "1.3.4"
scipy = "1.18.0"
numpy = "2.5.1"
matplotlib = "3.11.2"                     # draws the figures; as resolved in uv.lock

# The timing measurement of record: measured on terra with the PyPI wheel 0.1.3 and the
# v0.1.3 harness (an export of 952c5c95), by bench/run_timing.sh in this repository.
[timing]
host = "terra"
started_utc = "2026-11-16T17:17:18Z"
finished_utc = "2026-11-17T20:02:14Z"
library = "spectrafit-core 0.1.3, PyPI wheel, hash-pinned in uv.lock"
harness = "v0.1.3 (952c5c95), git archive export"
ladder = "--reps 4,10,20,50,100 (effective 2,5,10,25,50), --mc 8, seed 20260603"
seed_sweep = "seeds 20260603..20260652, --reps 10 (effective 5), --mc 8, headline-only"

# SHA-256 of the measured files the claims and Figure 3 are computed from (results/timing/).
[timing_inputs]
"results/timing/bench_summary.json" = "7f08587d088ddb370784c3ee772d9d197259ac733f4fcac161b8c75627a6b25e"
